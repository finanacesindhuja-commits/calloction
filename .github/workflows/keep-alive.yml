name: Render 24/7 Keep-Alive Pinger

on:
  schedule:
    # Runs every 14 minutes (Render idle sleep timeout is 15 minutes)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Keep Render Awake (External Cloud Ping)
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive HTTP Ping to Render
        run: |
          echo "Sending external keep-alive ping to https://calloction.onrender.com/api/health at $(date)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 --max-time 45 https://calloction.onrender.com/api/health)
          echo "Render Health Check HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "SUCCESS: Render is active, awake, and healthy!"
          else
            echo "WARNING: Received HTTP status $HTTP_STATUS from Render"
          fi
