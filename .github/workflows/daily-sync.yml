name: Daily 6 PM Google Sheets Sync

on:
  schedule:
    # 12:30 UTC is exactly 18:00 IST (6:00 PM India Standard Time)
    - cron: '30 12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  sync:
    name: Sync Unbilled Collections to Google Sheets
    runs-on: ubuntu-latest
    steps:
      - name: Trigger 6 PM Sync on Cloud Backend
        run: |
          echo "Starting daily 6 PM sync to Google Sheets..."
          RESPONSE=$(curl -s -X POST --retry 3 --retry-delay 10 --max-time 120 https://calloction.onrender.com/api/admin/sync-sheets)
          echo "Server Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q "completed successfully"; then
            echo "SUCCESS: Pending collections synced to Google Sheets successfully!"
          else
            echo "WARNING: Response did not contain success message. Response was: $RESPONSE"
          fi
